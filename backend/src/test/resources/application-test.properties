spring.application.name=smartmail-backend-test

# In-memory H2 Database for automated tests
spring.datasource.url=jdbc:h2:mem:smartmail_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=testSmartMailSuperSecretKeyForJwtTokenGenerationAndValidation2026SecureKey!
jwt.expiration-ms=3600000

gemini.api.key=TEST_MOCK_API_KEY
gemini.api.model=gemini-1.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.timeout-seconds=5

cors.allowed-origins=http://localhost:5173
